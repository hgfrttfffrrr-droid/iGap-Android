name: Build iGap APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # مرحله جدید: تغییر مخازن برای پیدا کردن کتابخانه‌های قدیمی
    - name: Fix Repositories in build.gradle
      run: |
        # اضافه کردن mavenCentral و google به مخازن اصلی
        sed -i 's/jcenter()/mavenCentral()\n        google()\n        maven { url "https:\/\/jitpack.io" }/g' build.gradle
        # اگر پلاگین bintray مشکل داشت، از مخزن جایگزین استفاده کنه
        sed -i 's|maven { url "https://plugins.gradle.org/m2/" }|maven { url "https://plugins.gradle.org/m2/" }\n        maven { url "https://maven.google.com" }|g' build.gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Inject API ID
      run: |
        echo "APP_API_ID=12345" >> gradle.properties

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: iGap-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
