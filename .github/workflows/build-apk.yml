name: Build iGap APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # مرحله جدید: حذف کامل پلاگین‌های bintray و realm از فایل‌های Gradle
    - name: Remove Deprecated Plugins from Gradle Files
      run: |
        # حذف پلاگین bintray از فایل build.gradle اصلی
        sed -i '/com.jfrog.bintray.gradle:gradle-bintray-plugin/d' build.gradle
        # حذف پلاگین realm از فایل build.gradle اصلی
        sed -i '/io.realm:realm-gradle-plugin/d' build.gradle
        # حذف خطوط مربوط به bintray در صورت وجود در فایل‌های دیگر
        grep -rl "bintray" . --include="*.gradle" | xargs sed -i '/bintray/d' 2>/dev/null || true
        grep -rl "realm-gradle-plugin" . --include="*.gradle" | xargs sed -i '/realm-gradle-plugin/d' 2>/dev/null || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Inject API ID
      run: |
        echo "APP_API_ID=12345" >> gradle.properties

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: iGap-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
